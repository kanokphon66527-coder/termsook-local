<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ / สมัครสมาชิก - Termsook Local</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --primary: #ca8a04;
            --primary-hover: #a16207;
            --primary-btn-bg: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            --primary-btn-hover: linear-gradient(135deg, #ca8a04 0%, #a16207 100%);
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --card-shadow: 0 20px 35px rgba(202, 138, 4, 0.08), 0 4px 12px rgba(15, 23, 42, 0.03);
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #eab308;
            --primary-hover: #ca8a04;
            --primary-btn-bg: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            --primary-btn-hover: linear-gradient(135deg, #ca8a04 0%, #a16207 100%);
            --border: #1e293b;
            --input-bg: #0b0f19;
            --card-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif !important;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .auth-top-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
        }

        .auth-control-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .auth-control-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 44px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .auth-logo-img {
            height: 95px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 10px rgba(234, 179, 8, 0.25));
            transition: transform 0.3s ease;
        }

        .auth-logo-img:hover {
            transform: scale(1.03);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--text-sub);
            margin-bottom: 28px;
        }

        .tab-group {
            display: flex;
            background: var(--bg-color);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-btn-bg);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-btn-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .back-home {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .back-home:hover {
            color: var(--primary);
        }

        /* Swal Customization */
        .swal2-popup {
            background: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-radius: 24px !important;
            border: 1px solid var(--border) !important;
        }
        .swal2-title { color: var(--text-main) !important; }
        .swal2-html-container { color: var(--text-sub) !important; }
        .swal2-confirm {
            background: var(--primary-btn-bg) !important;
            color: #0f172a !important;
            border-radius: 50px !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body data-theme="light">

    <div class="auth-top-controls">
        <button class="auth-control-btn" id="langToggle"><span>EN</span></button>
        <button class="auth-control-btn" id="themeToggle"><span>Dark</span></button>
    </div>

    <div class="auth-card">
        <a href="index.html">
            <img src="rogo_termsook-removebg-preview.png" alt="Termsook Local Logo" class="auth-logo-img">
        </a>
        <h1 class="auth-title">Termsook Local</h1>
        <p class="auth-subtitle" data-i18n="auth_subtitle">เข้าสู่ระบบเพื่อเข้าใช้งานแพลตฟอร์มท่องเที่ยวชุมชน</p>

        <div class="tab-group">
            <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')" data-i18n="tab_login">เข้าสู่ระบบ</button>
            <button class="tab-btn" id="tabRegister" onclick="switchTab('register')" data-i18n="tab_register">สมัครสมาชิก</button>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="label_email">อีเมล</label>
                <input type="email" id="loginEmail" placeholder="yourname@example.com" required>
            </div>
            <div class="form-group">
                <label data-i18n="label_password">รหัสผ่าน</label>
                <input type="password" id="loginPassword" placeholder="ระบุรหัสผ่านของคุณ" required>
            </div>
            <button type="submit" class="btn-submit" data-i18n="btn_login">เข้าสู่ระบบ</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label data-i18n="label_role">ประเภทบัญชีใช้งาน</label>
                <select id="regRole">
                    <option value="tourist" data-i18n="role_tourist">นักท่องเที่ยว (Tourist)</option>
                    <option value="merchant" data-i18n="role_merchant">พ่อค้าแม่ค้า / เจ้าของร้านค้า (Merchant)</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="label_email">อีเมล</label>
                <input type="email" id="regEmail" placeholder="yourname@example.com" required>
            </div>
            <div class="form-group">
                <label data-i18n="label_password">รหัสผ่าน</label>
                <input type="password" id="regPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6">
            </div>
            <button type="submit" class="btn-submit" data-i18n="btn_register">สมัครสมาชิก</button>
        </form>

        <a href="index.html" class="back-home" data-i18n="back_home">กลับไปหน้าหลัก (Home)</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDQEnrTsUwLclMAIFNmjjmP-W3GwmxAwfg",
          authDomain: "termsook-local.firebaseapp.com",
          projectId: "termsook-local",
          storageBucket: "termsook-local.firebasestorage.app",
          messagingSenderId: "391909981716",
          appId: "1:391909981716:web:919d5cb4b8bad052037101"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const i18nDict = {
            th: {
                auth_subtitle: "เข้าสู่ระบบเพื่อเข้าใช้งานแพลตฟอร์มท่องเที่ยวชุมชน",
                tab_login: "เข้าสู่ระบบ",
                tab_register: "สมัครสมาชิก",
                label_email: "อีเมล",
                label_password: "รหัสผ่าน",
                label_role: "ประเภทบัญชีใช้งาน",
                role_tourist: "นักท่องเที่ยว (Tourist)",
                role_merchant: "พ่อค้าแม่ค้า / เจ้าของร้านค้า (Merchant)",
                btn_login: "เข้าสู่ระบบ",
                btn_register: "สมัครสมาชิก",
                back_home: "กลับไปหน้าหลัก (Home)"
            },
            en: {
                auth_subtitle: "Sign in to access Termsook Local platform",
                tab_login: "Sign In",
                tab_register: "Register",
                label_email: "Email Address",
                label_password: "Password",
                label_role: "Account Type",
                role_tourist: "Tourist",
                role_merchant: "Merchant / Shop Owner",
                btn_login: "Sign In",
                btn_register: "Register Now",
                back_home: "Back to Home"
            }
        };

        let currentLang = 'th';
        function applyLanguage(lang) {
            currentLang = lang;
            const dict = i18nDict[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            document.getElementById('langToggle').querySelector('span').textContent = lang === 'th' ? 'EN' : 'TH';
        }

        document.getElementById('langToggle').addEventListener('click', () => applyLanguage(currentLang === 'th' ? 'en' : 'th'));
        document.getElementById('themeToggle').addEventListener('click', () => {
            const body = document.body;
            const next = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            document.getElementById('themeToggle').querySelector('span').textContent = next === 'dark' ? 'Light' : 'Dark';
        });

        window.switchTab = function(mode) {
            document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value.trim());
                await Swal.fire({ icon: 'success', title: currentLang === 'th' ? 'เข้าสู่ระบบสำเร็จ' : 'Sign in successful!', timer: 1200, showConfirmButton: false });
                window.location.href = 'index.html';
            } catch (err) { Swal.fire({ icon: 'error', title: currentLang === 'th' ? 'เข้าสู่ระบบไม่สำเร็จ' : 'Sign in failed', text: currentLang === 'th' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'Invalid email or password' }); }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value.trim(), document.getElementById('regPassword').value.trim());
                await setDoc(doc(db, "users", cred.user.uid), { email: cred.user.email, role: document.getElementById('regRole').value, exp: 50, createdAt: serverTimestamp() });
                await Swal.fire({ icon: 'success', title: currentLang === 'th' ? 'สมัครสมาชิกสำเร็จ' : 'Registration successful!', timer: 1200, showConfirmButton: false });
                window.location.href = 'index.html';
            } catch (err) { Swal.fire({ icon: 'error', title: currentLang === 'th' ? 'สมัครสมาชิกไม่สำเร็จ' : 'Registration failed', text: err.message }); }
        });
    </script>
</body>
</html>
